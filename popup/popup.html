<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extractor MD</title>
  <link rel="stylesheet" href="./popup.css" />
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <img src="../assets/icons/icon32.png" width="32" height="32" alt="Extractor MD" />
        <div class="brand-text">
          <h1>Extractor MD</h1>
          <p class="brand-byline">Rz Inc.</p>
        </div>
      </div>
      <span class="version">v0.5.1</span>
    </header>

    <section class="config-panel" aria-label="Outputs">
      <span class="config-title">Outputs</span>
      <div id="outputsList" class="checkbox-grid checkbox-grid-4"></div>
    </section>

    <section class="config-panel" aria-label="Skills">
      <span class="config-title">Skills</span>
      <div id="skillsList" class="checkbox-grid"></div>
    </section>

    <p id="status" class="status" hidden></p>
    <ul id="issues" class="issues" hidden></ul>

    <section id="helpPanel" class="help-panel" hidden>
      <div class="help-header">
        <h2>How This Was Generated</h2>
        <button id="closeHelpBtn" type="button" class="help-close">Close</button>
      </div>
      <div id="helpContent" class="help-content"></div>
    </section>

    <section class="preview-wrap">
      <div class="preview-header">
        <div id="outputTabs" class="output-tabs" role="tablist"></div>
        <div class="preview-actions-inline">
          <button id="refreshBtn" type="button" class="icon-btn" aria-label="Refresh">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
          <button id="helpBtn" type="button" class="icon-btn" aria-label="Info">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <path d="M12 17h.01"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="textarea-container">
        <textarea id="preview" readonly placeholder="Run extraction to populate this preview."></textarea>
        <div class="preview-actions">
          <button id="copyBtn" type="button" class="icon-btn" disabled aria-label="Copy active tab">
            <svg class="icon-copy" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg class="icon-success" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
          <button id="downloadBtn" type="button" class="icon-btn" disabled aria-label="Download active tab">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <section class="quick-install" aria-label="Quick install providers">
      <span class="quick-install-title">Quick install all selected outputs</span>
      <div class="quick-install-buttons">
        <button type="button" class="quick-install-btn" data-provider="claude" data-tooltip="Select your working project folder">
          <img src="../assets/logos/claude-color.svg" class="ai-logo" alt="" aria-hidden="true" />
          Claude Code
        </button>
        <button type="button" class="quick-install-btn" data-provider="codex" data-tooltip="Select your working project folder">
          <img src="../assets/logos/codex-color.svg" class="ai-logo" alt="" aria-hidden="true" />
          Codex
        </button>
        <button type="button" class="quick-install-btn" data-provider="cursor" data-tooltip="Select your working project folder">
          <img src="../assets/logos/cursor.svg" class="ai-logo" alt="" aria-hidden="true" />
          Cursor
        </button>
      </div>
      <p id="quickInstallResult" class="quick-install-result" hidden></p>
    </section>

    <footer class="footnote">
      Extractor MD &middot; Rz Inc.
    </footer>
  </main>

  <script type="module" src="./popup.js"></script>
</body>

</html>
